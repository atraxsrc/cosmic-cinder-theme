# Cinder colour scheme for qt5ct / qt6ct, part of cosmic-cinder-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Cinder, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#b3adad, #1a1a1e, #383735, #2a2a30, #0c0c0c, #222228, #b3adad, #dbd9d3, #b3adad, #0c0c0c, #121212, #0c0c0c, #cc6528, #121212, #cc6528, #e19e74, #1a1a1e, #121212, #1a1a1e, #b3adad, #8a8575
disabled_colors=#626a78, #1a1a1e, #383735, #2a2a30, #0c0c0c, #222228, #626a78, #90947a, #626a78, #121212, #121212, #0c0c0c, #383735, #90947a, #8a8575, #8a8575, #1a1a1e, #121212, #1a1a1e, #b3adad, #383735
inactive_colors=#b3adad, #1a1a1e, #383735, #2a2a30, #0c0c0c, #222228, #b3adad, #dbd9d3, #b3adad, #0c0c0c, #121212, #0c0c0c, #cc6528, #121212, #cc6528, #e19e74, #1a1a1e, #121212, #1a1a1e, #b3adad, #8a8575

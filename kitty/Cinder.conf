# Cinder for kitty, part of cosmic-cinder-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Cinder.conf

foreground              #B3ADAD
background              #121212
selection_foreground    none
selection_background    #2A2A30

cursor                  #CC6528
cursor_text_color       #121212

url_color               #C6C4B0
url_style               curly

active_border_color     #CC6528
inactive_border_color   #383735
bell_border_color       #E19E74

active_tab_foreground   #121212
active_tab_background   #CC6528
inactive_tab_foreground #90947A
inactive_tab_background #1A1A1E
tab_bar_background      #121212

mark1_foreground        #121212
mark1_background        #A5A297
mark2_foreground        #121212
mark2_background        #C6C4B0
mark3_foreground        #121212
mark3_background        #E19E74


# Cinder for lazygit, part of cosmic-cinder-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/cinder.yml and
# zsh/cinder.zsh sets LG_CONFIG_FILE to "config.yml,cinder.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/cinder.yml"
gui:
  theme:
    activeBorderColor:
      - "#CC6528"
      - bold
    inactiveBorderColor:
      - "#383735"
    searchingActiveBorderColor:
      - "#E19E74"
      - bold
    optionsTextColor:
      - "#90947A"
    selectedLineBgColor:
      - "#222228"
    inactiveViewSelectedLineBgColor:
      - "#1A1A1E"
    cherryPickedCommitFgColor:
      - "#121212"
    cherryPickedCommitBgColor:
      - "#C6C4B0"
    markedBaseCommitFgColor:
      - "#121212"
    markedBaseCommitBgColor:
      - "#A5A297"
    unstagedChangesColor:
      - "#C75E57"
    defaultFgColor:
      - "#B3ADAD"
  authorColors:
    "*": "#C6C4B0"
